name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  edge-agent:
    name: Edge agent (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: edge-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        working-directory: edge-agent
        run: ruff check aura/ tests/ agent.py
        continue-on-error: true
      - name: Test
        working-directory: edge-agent
        run: python -m pytest tests/ -q --durations=10

  native-core:
    name: Native core (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the native test suite
        working-directory: android-app/app/src/main/cpp
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I. \
              tests/test_aura_core.cpp aura_core.cpp -o aura_test
          ./aura_test
      - name: Build with sanitizers
        working-directory: android-app/app/src/main/cpp
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -I. \
              tests/test_aura_core.cpp aura_core.cpp -o aura_test_asan
          ./aura_test_asan

  visualizer:
    name: Web visualiser (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-visualizer/package.json
      - name: Install
        working-directory: web-visualizer
        run: npm install
      - name: Syntax check
        working-directory: web-visualizer
        run: for f in src/*.js server.js; do node --check "$f"; done
      - name: Smoke test the server
        working-directory: web-visualizer
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          kill $SERVER_PID

  integration:
    name: Integration (agent + visualiser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Start the stack
        run: |
          pip install -r edge-agent/requirements.txt
          (cd edge-agent && python agent.py --port 8080 &)
          (cd web-visualizer && npm install && node server.js &)
          sleep 12
      - name: Verify the pipeline end to end
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"status"'
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"agentReachable":true'
          curl -fsS http://127.0.0.1:3000/api/v1/agent/state | grep -q '"ekf"'
          curl -fsS http://127.0.0.1:3000/api/v1/agent/export/gltf | grep -q '"asset"'
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/agent/audit \
               -H 'Content-Type: application/json' \
               -d '{"action":"ci.check"}' | grep -q chain_hash
          curl -fsS http://127.0.0.1:3000/api/v1/agent/audit/verify | grep -q '"valid":true'
