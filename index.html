<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokumentation · CT45 XP 3D-Raumerfassung</title>

  <!-- MathJax (Formeln) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>

  <!-- marked (Markdown-Parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #4f9dff;
      --border: #262b35;
      --code-bg: #11141a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #11151c, #0f1115);
      border-bottom: 1px solid var(--border);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 13px; margin-left: auto; }

    .layout { display: flex; align-items: flex-start; }
    nav {
      position: sticky;
      top: 53px;
      width: 300px;
      flex: 0 0 300px;
      height: calc(100vh - 53px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 22px 16px;
      background: var(--panel);
    }
    nav h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); margin: 0 0 10px;
    }
    nav .docs { list-style: none; padding: 0; margin: 0 0 22px; }
    nav .docs li { margin: 4px 0; }
    nav .docs a {
      display: block; padding: 8px 11px; border-radius: 8px;
      color: var(--text); text-decoration: none; font-size: 13.5px;
      border: 1px solid transparent;
    }
    nav .docs a:hover { border-color: var(--border); background: #13161d; }
    nav .docs a.active {
      border-color: var(--accent);
      background: #16263d;
      color: #d6e8ff;
    }
    nav ol { margin: 0; padding-left: 18px; }
    nav li.toc { margin: 6px 0; font-size: 13px; }
    nav a.toclink { color: var(--text); text-decoration: none; }
    nav a.toclink:hover { color: var(--accent); }

    main {
      flex: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 48px 120px;
    }
    main h1 { font-size: 30px; line-height: 1.2; margin-top: 0; }
    main h2 {
      font-size: 22px; margin-top: 48px; padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    main h3 { font-size: 17px; margin-top: 28px; color: #cdd6e4; }
    main p { color: #d7dce5; }
    main a { color: var(--accent); }
    main code {
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 5px; font-size: 13px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    main pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; overflow-x: auto;
    }
    main pre code { background: none; border: none; padding: 0; font-size: 12.5px; }
    main table {
      border-collapse: collapse; width: 100%; margin: 22px 0; font-size: 13.5px;
    }
    main th, main td {
      border: 1px solid var(--border); padding: 9px 11px; text-align: left; vertical-align: top;
    }
    main thead th { background: #1d2230; color: #eaf0fb; font-weight: 600; }
    main tbody tr:nth-child(even) { background: #141821; }
    main blockquote {
      border-left: 3px solid var(--accent); margin: 18px 0; padding: 4px 16px;
      color: var(--muted); background: #13161d; border-radius: 0 6px 6px 0;
    }
    main ul { padding-left: 22px; }
    main li { margin: 6px 0; }

    .loading { color: var(--muted); padding: 40px 0; }

    @media (max-width: 860px) {
      nav { display: none; }
      main { padding: 28px 20px 90px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>CT45 XP · 3D-Raumerfassung &amp; Wanddurchdringung</h1>
    <span class="sub">Technische Dokumentation</span>
  </header>

  <div class="layout">
    <nav>
      <h2>Dokumentation</h2>
      <ul class="docs" id="doclist"></ul>
      <h2>Inhalt (dieses Dok.)</h2>
      <ol id="toc"></ol>
    </nav>
    <main>
      <div id="content" class="loading">Lade Dokumentation …</div>
    </main>
  </div>

  <script>
    const DOCS = [
      { id: 'whitepaper', file: 'docs/whitepaper.md',
        title: 'Whitepaper: 3D-Raumerfassung & Wanddurchdringung' },
      { id: 'app', file: 'docs/app-projektvorlage.md',
        title: 'App-Projektvorlage (Android) / CT45 XP' },
      { id: 'swarmradar', file: 'docs/swarmradar.md',
        title: 'App-Projekt: SwarmRadar (CT45 XP)' }
    ];

    function currentDocId() {
      const p = new URLSearchParams(location.search).get('doc');
      return DOCS.some(d => d.id === p) ? p : 'whitepaper';
    }

    function renderDocList(activeId) {
      const ul = document.getElementById('doclist');
      ul.innerHTML = '';
      DOCS.forEach(d => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.textContent = d.title;
        a.href = '?doc=' + d.id;
        if (d.id === activeId) a.className = 'active';
        a.addEventListener('click', (e) => {
          e.preventDefault();
          history.replaceState(null, '', '?doc=' + d.id);
          loadDoc(d.id, true);
        });
        li.appendChild(a);
        ul.appendChild(li);
      });
    }

    async function loadDoc(id, scrollTop) {
      const doc = DOCS.find(d => d.id === id) || DOCS[0];
      const content = document.getElementById('content');
      content.classList.add('loading');
      content.innerHTML = 'Lade „' + doc.title + '“ …';
      renderDocList(id);
      try {
        const md = await (await fetch(doc.file, { cache: 'no-store' })).text();

        // Mathe-Platzhalter schützen, damit marked sie nicht zerschießt
        const mathStore = [];
        let safe = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => {
          mathStore.push('$$' + m + '$$');
          return '@@M' + (mathStore.length - 1) + '@@';
        });
        safe = safe.replace(/\$([^$\n]+?)\$/g, (_, m) => {
          mathStore.push('$' + m + '$');
          return '@@M' + (mathStore.length - 1) + '@@';
        });

        let html = marked.parse(safe, { gfm: true, breaks: false });
        html = html.replace(/@@M(\d+)@@/g, (_, i) => mathStore[+i]);

        content.innerHTML = html;
        content.classList.remove('loading');

        buildToc();

        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([content]);
        }
        if (scrollTop) window.scrollTo({ top: 0 });
        if (location.hash) {
          const el = document.getElementById(location.hash.slice(1));
          if (el) el.scrollIntoView();
        }
      } catch (e) {
        content.innerHTML = '<p style="color:#ff8080">Fehler beim Laden der Dokumentation: ' + e + '</p>';
      }
    }

    function buildToc() {
      const toc = document.getElementById('toc');
      const heads = document.querySelectorAll('#content h2');
      toc.innerHTML = '';
      heads.forEach((h, i) => {
        if (!h.id) h.id = 'h-' + i;
        const li = document.createElement('li');
        li.className = 'toc';
        const a = document.createElement('a');
        a.className = 'toclink';
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          history.replaceState(null, '', '#' + h.id);
          h.scrollIntoView({ behavior: 'smooth' });
        });
        li.appendChild(a);
        toc.appendChild(li);
      });
    }

    window.addEventListener('hashchange', () => {
      const el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    });

    loadDoc(currentDocId(), true);
  </script>
</body>
</html>
